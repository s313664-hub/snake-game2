<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Snake Legend</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(180deg,#08111f,#020408);
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:15px;
    color:#6dffb3;
}

#info{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:15px;
    flex-wrap:wrap;
}

.card{
    background:#132235;
    padding:10px 15px;
    border-radius:10px;
    min-width:120px;
}

canvas{
    background:#0a0f18;
    border:3px solid #55ffbb;
    border-radius:15px;
    box-shadow:0 0 30px #55ffbb55;
}

#message{
    height:40px;
    margin-top:10px;
    font-size:24px;
    color:gold;
    font-weight:bold;
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#22cc77;
    color:white;
    font-size:18px;
    cursor:pointer;
}

#ranking{
    width:320px;
    margin:20px auto;
    background:#132235;
    border-radius:15px;
    padding:15px;
}

ol{
    text-align:left;
}
</style>
</head>
<body>

<h1>🐍 Gem Snake Legend</h1>

<div id="info">
<div class="card">分數<br><span id="score">0</span></div>
<div class="card">時間<br><span id="time">0</span>s</div>
<div class="card">關卡<br><span id="level">1</span></div>
<div class="card">Combo<br><span id="combo">0</span></div>
</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="message"></div>

<button onclick="startGame()">開始遊戲</button>

<div id="ranking">
<h2>🏆 TOP 5</h2>
<ol id="rankList"></ol>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const grid=20;
const tiles=30;

let snake=[];
let food={};

let direction={x:1,y:0};
let queue=[];

let score=0;
let level=1;
let timer=0;

let combo=0;
let comboTime=0;

let gemsEaten=0;

let gameLoop;
let timerLoop;

const levelThresholds=[0,5,12,20,30];

function startGame(){

    snake=[
        {x:15,y:15},
        {x:14,y:15},
        {x:13,y:15}
    ];

    direction={x:1,y:0};
    queue=[];

    score=0;
    level=1;
    timer=0;
    combo=0;
    gemsEaten=0;

    updateUI();

    generateFood();

    clearInterval(gameLoop);
    clearInterval(timerLoop);

    gameLoop=setInterval(updateGame,getSpeed());

    timerLoop=setInterval(()=>{
        timer++;
        updateUI();
    },1000);

    document.getElementById("message").innerText="";
}

function getSpeed(){

    switch(level){
        case 1:return 140;
        case 2:return 125;
        case 3:return 110;
        case 4:return 95;
        case 5:return 80;
    }

    return 80;
}

function updateLevel(){

    let old=level;

    if(gemsEaten>=30) level=5;
    else if(gemsEaten>=20) level=4;
    else if(gemsEaten>=12) level=3;
    else if(gemsEaten>=5) level=2;

    if(old!==level){

        document.getElementById("message").innerText=
        `LEVEL ${level}!`;

        setTimeout(()=>{
            document.getElementById("message").innerText="";
        },1200);

        clearInterval(gameLoop);
        gameLoop=setInterval(updateGame,getSpeed());
    }
}

function generateFood(){

    while(true){

        let x=Math.floor(Math.random()*tiles);
        let y=Math.floor(Math.random()*tiles);

        let overlap=snake.some(
            p=>p.x===x&&p.y===y
        );

        if(!overlap){

            food={x,y};
            return;
        }
    }
}

function updateGame(){

    if(queue.length){
        direction=queue.shift();
    }

    let head={
        x:snake[0].x+direction.x,
        y:snake[0].y+direction.y
    };

    // 穿牆模式
    if(head.x<0) head.x=tiles-1;
    if(head.x>=tiles) head.x=0;
    if(head.y<0) head.y=tiles-1;
    if(head.y>=tiles) head.y=0;

    for(let i=1;i<snake.length;i++){

        if(
            snake[i].x===head.x &&
            snake[i].y===head.y
        ){
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if(
        head.x===food.x &&
        head.y===food.y
    ){

        gemsEaten++;

        if(Date.now()-comboTime<3000){
            combo++;
        }else{
            combo=1;
        }

        comboTime=Date.now();

        score += 10 + (combo*2);

        generateFood();

        updateLevel();

    }else{

        snake.pop();
    }

    updateUI();
    draw();
}

function draw(){

    ctx.fillStyle="#08111f";
    ctx.fillRect(0,0,600,600);

    // food glow
    ctx.shadowBlur=20;
    ctx.shadowColor="#00ffff";

    ctx.fillStyle="#00ffff";

    ctx.beginPath();
    ctx.arc(
        food.x*grid+10,
        food.y*grid+10,
        8,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.shadowBlur=0;

    snake.forEach((part,index)=>{

        if(index===0){

            ctx.fillStyle="#88ffcc";

            ctx.shadowBlur=20;
            ctx.shadowColor="#88ffcc";

        }else{

            ctx.fillStyle="#22cc77";
        }

        ctx.beginPath();

        ctx.roundRect(
            part.x*grid+1,
            part.y*grid+1,
            18,
            18,
            6
        );

        ctx.fill();

        ctx.shadowBlur=0;
    });
}

function updateUI(){

    document.getElementById("score").innerText=score;
    document.getElementById("time").innerText=timer;
    document.getElementById("level").innerText=level;
    document.getElementById("combo").innerText=combo;
}

function gameOver(){

    clearInterval(gameLoop);
    clearInterval(timerLoop);

    saveScore();

    alert(
        `遊戲結束\n分數:${score}`
    );
}

function saveScore(){

    let name=prompt("輸入玩家名稱");

    if(!name) name="玩家";

    let ranking=
        JSON.parse(
            localStorage.getItem("snakeTop5")
        )||[];

    ranking.push({
        name,
        score,
        time:timer
    });

    ranking.sort((a,b)=>{

        if(b.score!==a.score)
            return b.score-a.score;

        return a.time-b.time;
    });

    ranking=ranking.slice(0,5);

    localStorage.setItem(
        "snakeTop5",
        JSON.stringify(ranking)
    );

    loadRanking();
}

function loadRanking(){

    let ranking=
        JSON.parse(
            localStorage.getItem("snakeTop5")
        )||[];

    document.getElementById("rankList")
    .innerHTML=
    ranking.map(
        p=>`<li>${p.name} - ${p.score}分 (${p.time}s)</li>`
    ).join("");
}

document.addEventListener("keydown",(e)=>{

    let newDir=null;

    if(e.key==="ArrowUp"||e.key==="w")
        newDir={x:0,y:-1};

    if(e.key==="ArrowDown"||e.key==="s")
        newDir={x:0,y:1};

    if(e.key==="ArrowLeft"||e.key==="a")
        newDir={x:-1,y:0};

    if(e.key==="ArrowRight"||e.key==="d")
        newDir={x:1,y:0};

    if(!newDir) return;

    const current=
        queue.length
        ? queue[queue.length-1]
        : direction;

    if(
        current.x + newDir.x ===0 &&
        current.y + newDir.y ===0
    ){
        return;
    }

    queue.push(newDir);
});

loadRanking();
draw();

</script>

</body>
</html>
